<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- flutter build web --base-href 값이 들어간다 (GitHub Pages는 /axis-app/). -->
  <base href="/axis-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="흔들림 없는 일상의 중심축, axis 플래너">

  <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 피그마처럼 흰 배경에 검은 시계·배터리. iOS는 홈 화면에 추가할 때 이 값을 읽으므로 바꾸면 다시 추가해야 한다. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="axis">
  <meta name="theme-color" content="#ffffff">
  <!-- 아이콘을 바꾸면 파일 이름도 바꿔야 휴대폰·브라우저에 남은 예전 아이콘 대신 새 아이콘을 받는다. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/axis-180.png">
  <link rel="icon" type="image/png" href="icons/axis-64.png">
  <link rel="manifest" href="manifest.json?v=3">
  <title>axis</title>

  <style>
    /* 휴대폰에서는 화면 전체, 넓은 화면에서는 가운데 휴대폰 크기 틀 안에 앱을 띄운다. */
    html, body { height: 100%; }
    body { margin: 0; background: #0b1220; display: flex; justify-content: center; }
    #app { position: relative; width: 100%; max-width: 430px; height: 100%; background: #000; overflow: hidden; }
    @media (min-width: 600px) and (min-height: 760px) {
      body { align-items: center; }
      #app { height: min(900px, 94%); border-radius: 28px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    }
    @media (display-mode: standalone) {
      body { background: #fff; }
    }
    /* 앱이 뜨기 전 첫 화면 배경을 미리 보여 주고, 아래에 작은 로딩 표시를 둔다. */
    #loading { position: absolute; inset: 0; background: #000 url(assets/assets/images/bg_welcome.png) center / cover no-repeat; }
    #loading::after {
      content: ''; position: absolute; left: 50%; bottom: 72px; width: 22px; height: 22px; margin-left: -11px;
      border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div id="loading" role="progressbar" aria-label="앱을 불러오는 중"></div></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 한 번 받은 앱 파일을 저장해 두어 다음부터 빨리 열리게 한다(web/sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
