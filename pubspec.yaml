name: axis_app
description: "axis 플래너 - 흔들림 없는 일상의 중심축"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  web: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/images/characters/square/
    - assets/icons/
    - assets/icons/tab/
    - assets/images/main/
    - assets/images/kit/
    - assets/icons/kit/
    - assets/icons/community/
    - assets/images/my/
    - assets/images/event/
    - assets/images/planner/
    - assets/images/community/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800

# 앱 아이콘: `dart run flutter_launcher_icons`로 iOS·Android 아이콘을 다시 만든다.
flutter_launcher_icons:
  image_path: assets/app_icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
